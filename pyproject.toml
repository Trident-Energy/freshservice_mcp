[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freshservice-mcp"
version = "1.0.0"
description = "An MCP server for Freshservice"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "build>=1.2.2.post1",
    "httpx==0.28.1",
    "mcp[cli]>=1.30.0,<2",
    "pydantic>=2.10.6",
]

[[project.authors]]
name = "Gopi Krishnan"
email = "gopi@effy.co.in"

[[project.authors]]
name = "Maanaesh Swamy"
email = "maanaesh.s@effy.co.in"

[[project.authors]]
name = "Vijay Ragunath"
email = "vijay.r@effy.co.in"

[project.scripts]
freshservice-mcp = "freshservice_mcp.server:main"

# Bound security-sensitive transitive dependencies for uv's supported lock path.
# Major cryptography and Starlette migrations require a separate review.
[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2,<5",
    "cryptography>=46.0.7,<47",
    "idna>=3.15,<4",
    "pyjwt>=2.15.1,<3",
    "python-multipart>=0.0.31,<0.1",
    "starlette>=0.49.1,<1",
]
